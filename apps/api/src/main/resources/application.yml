server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: points-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/points}
    username: ${DB_USERNAME:points}
    password: ${DB_PASSWORD:points_dev_pwd}
    hikari:
      # 拿不到连接 3 秒就失败：健康检查要「快速说不」，不能挂在那儿等 30 秒
      connection-timeout: 3000
      validation-timeout: 2000
  jpa:
    hibernate:
      ddl-auto: validate          # 表结构只由 Flyway 管，绝不让 JPA 自动改
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    # 生产环境必须通过环境变量覆盖（deploy/.env）
    secret: ${JWT_SECRET:dev-only-secret-please-change-me-0123456789abcdef}
    ttl-minutes: ${JWT_TTL_MINUTES:720}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info        # 只暴露这两个，别学老项目 include:"*"
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
